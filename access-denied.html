<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>需要存取代碼或連結 / Access code or link required</title>
    <link rel="stylesheet" href="styles.css?v=20260724-diet-frequency-v2" />
    <style>
      .access-denied-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(24px, 5vw, 72px);
        background: #edf1ee;
      }
      .access-denied-card {
        width: min(560px, 100%);
        background: var(--surface, #ffffff);
        border: 1px solid var(--line, #d8e0dc);
        border-radius: 16px;
        padding: clamp(28px, 4vw, 40px);
        box-shadow: 0 18px 48px rgba(15, 32, 30, 0.08);
      }
      .access-denied-card .brand-row {
        color: var(--ink, #162021);
        margin-bottom: 24px;
      }
      .access-denied-card h1 {
        font-size: clamp(22px, 3vw, 28px);
        margin: 0 0 8px;
        color: var(--ink, #162021);
      }
      .access-denied-card p {
        color: var(--muted, #5d6968);
        line-height: 1.6;
        margin: 0 0 16px;
      }
      .access-denied-card .lang-block + .lang-block {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--line, #d8e0dc);
      }
      .code-form {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--line, #d8e0dc);
      }
      .code-form label {
        display: block;
        font-weight: 600;
        color: var(--ink, #162021);
        margin-bottom: 8px;
      }
      .code-form .code-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .code-form input[type="text"] {
        flex: 1 1 200px;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--line, #d8e0dc);
        border-radius: 8px;
        font-size: 16px;
      }
      .code-form button {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: var(--teal, #0f766e);
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }
      .code-form button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .code-error {
        margin: 12px 0 0;
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <main class="access-denied-shell">
      <section class="access-denied-card">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">
            <img src="assets/eg-biomed-icon.png" alt="" />
          </span>
          <span>EG BioMed 愛立基生醫</span>
        </div>
        <div class="lang-block" lang="zh-Hant">
          <h1>此連結目前無法使用</h1>
          <p>
            這個連結可能已過期、已經使用過，或尚未確認付款狀態。
            如需協助，請聯繫我們的客服團隊，我們會協助您確認狀態或重新提供連結。
          </p>
        </div>
        <div class="lang-block" lang="en">
          <h1>This link is not available</h1>
          <p>
            This link may have expired, already been used, or payment has not
            yet been confirmed. Please contact our support team for help
            checking your status or requesting a new link.
          </p>
        </div>
        <form class="code-form" id="code-form">
          <label for="code-input">
            如果您所屬的機構已提供存取代碼，請在下方輸入以繼續。<br />
            If your organization gave you an access code, enter it below to continue.
          </label>
          <div class="code-row">
            <input id="code-input" name="code" type="text" autocomplete="off" required minlength="6" placeholder="存取代碼 / Access code" />
            <button type="submit">繼續 / Continue</button>
          </div>
          <p class="code-error" id="code-error" role="alert" hidden></p>
        </form>
      </section>
    </main>
    <script>
      document.getElementById("code-form").addEventListener("submit", async function (event) {
        event.preventDefault();
        var button = event.target.querySelector("button");
        var errorEl = document.getElementById("code-error");
        var input = document.getElementById("code-input");
        errorEl.hidden = true;
        button.disabled = true;
        try {
          var response = await fetch("/api/access/redeem-code", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ code: input.value })
          });
          if (response.ok) {
            window.location.href = "/";
            return;
          }
          errorEl.textContent = "代碼無法辨識，請確認後再試一次。 / Code not recognized. Please check it and try again.";
          errorEl.hidden = false;
        } catch (error) {
          errorEl.textContent = "網路錯誤，請再試一次。 / Network error. Please try again.";
          errorEl.hidden = false;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
