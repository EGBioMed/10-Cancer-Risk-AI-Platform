services:
  - type: web
    name: eg-biomed-cancer-risk-assessment
    env: node
    plan: starter
    buildCommand: ""
    startCommand: "npm start"
    # Every variable here is `sync: false` -- the key is declared, the value is
    # set in the Render dashboard and never committed. Declaring the key is not
    # cosmetic: a Blueprint sync prunes dashboard variables this file does not
    # list, and on 2026-09-09 that took out ACCESS_GATE_SESSION_SECRET, which
    # server.js requires whenever ACCESS_GATE_MODE is enforced (the default, so
    # that a deployment which forgets the variable fails closed rather than
    # serving the questionnaire to anyone). The process threw on startup and
    # the whole site was down until the value was restored by hand. Anything
    # this service reads from the environment belongs in this list.
    #
    # `test-render-config.js` now enforces that: it reads every process.env.*
    # in server.js, lib/ and scripts/ and fails if one is neither declared
    # below nor in its documented exclusion list. The list had drifted to 8 of
    # 20 by 2026-11-17 -- INSTITUTION_BRANDING among them, so a single sync
    # would have silently un-branded both partner entrances -- which is why
    # there is a check rather than another comment asking people to remember.
    envVars:
      # --- Where a submission goes ----------------------------------------
      - key: SUBMISSION_MODE
        sync: false
      - key: POWER_AUTOMATE_WEBHOOK_URL
        sync: false
      - key: POWER_AUTOMATE_WEBHOOK_URL_PUBLIC
        sync: false

      # --- The access gate --------------------------------------------------
      - key: ACCESS_GATE_MODE
        sync: false
      - key: ACCESS_GATE_SESSION_SECRET
        sync: false
      - key: ACCESS_GATE_SESSION_TTL_HOURS
        sync: false
      - key: ACCESS_GATE_COOKIE_SECURE
        sync: false
      - key: ACCESS_GATE_BACKEND
        sync: false
      - key: AZURE_ACCESS_GATE_API_BASE_URL
        sync: false
      - key: AZURE_ACCESS_GATE_API_KEY
        sync: false

      # --- Paid reports ------------------------------------------------------
      # Must hold the same value as the data API's REPORT_TICKET_SECRET, or
      # every payment link fails a deliberately generic ticket check.
      - key: REPORT_TICKET_SECRET
        sync: false

      # --- Per-institution behaviour -----------------------------------------
      # INSTITUTION_BRANDING is the partner co-branding whitelist (Numia, Hua
      # Kang). Losing it strips every partner's mark from their entrance
      # without raising an error -- the entrances keep working, unbranded.
      - key: INSTITUTION_BRANDING
        sync: false
      - key: INSTITUTION_REPORT_RECIPIENTS
        sync: false
      # INTAKE_ENTRANCES: which access codes open the research-intake
      # questionnaire (lib/questionnaire-mode.js). Losing it turns every intake
      # entrance back into the questionnaire on sale -- asking for an Email --
      # without raising an error.
      - key: INTAKE_ENTRANCES
        sync: false
      # INTAKE_POWER_AUTOMATE_WEBHOOK_URL: the research-intake flow's HTTP trigger --
      # a separate flow from the two report flows above, which must never be
      # put here. Losing it makes every intake submission fail with a
      # "not open yet" message.
      - key: INTAKE_POWER_AUTOMATE_WEBHOOK_URL
        sync: false

      # --- Operator tooling run from this service's Shell --------------------
      # scripts/grant-access.js prints entry links against PUBLIC_BASE_URL.
      - key: PUBLIC_BASE_URL
        sync: false

      # --- Postgres (the ACCESS_GATE_BACKEND=postgres rollback path) ---------
      # Unused while the gate runs on azure_mysql, which is exactly why it is
      # easy to prune by accident and not notice until the rollback is needed.
      - key: DATABASE_URL
        sync: false
      - key: PGPOOL_MAX
        sync: false
      - key: RUN_DATABASE_MIGRATIONS
        sync: false

      # --- Conversational page classifier ------------------------------------
      # Unset today (/api/health reports chat_classifier_configured: false);
      # declared so that setting it later survives the next sync.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHAT_CLASSIFIER_MODEL
        sync: false
      - key: CHAT_CLASSIFIER_EFFORT
        sync: false

    # Deliberately NOT declared, and why:
    #
    #   PORT      Render injects it. Declaring it would let a sync create a
    #             Blueprint-owned PORT -- empty, since there is no dashboard
    #             value -- and server.js would then fall back to 3000 while
    #             Render waited on the port it assigned. The health check
    #             would fail and the deploy would roll back.
    #   HOST      Read only by the on-premises deployment; on this service the
    #             code derives it from SUBMISSION_MODE.
    #   PGHOST, PGDATABASE, PG_DUMP_PATH, LOCAL_BACKUP_DIR,
    #   LOCAL_BACKUP_RETENTION_DAYS
    #             Read only by the local backup/export scripts, which run on
    #             the on-premises Windows server, never here.
