<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="淋巴結腫大常見的位置：頸部、腋下、鼠蹊部">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF7F5"/>
      <stop offset="1" stop-color="#DDEFEB"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EBB896"/>
      <stop offset="0.45" stop-color="#F8D9C2"/>
      <stop offset="1" stop-color="#E6AE8A"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB8AE"/>
      <stop offset="1" stop-color="#5E9E93"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C6F8C"/>
      <stop offset="1" stop-color="#46586F"/>
    </linearGradient>
    <radialGradient id="node" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFB38A"/>
      <stop offset="0.55" stop-color="#F0703F"/>
      <stop offset="1" stop-color="#C9481E"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F26B3A" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#F26B3A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F26B3A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B4F48" flood-opacity="0.16"/>
    </filter>
    <g id="cluster">
      <circle r="26" fill="url(#glow)"/>
      <ellipse cx="-6" cy="-3" rx="7" ry="5.5" fill="url(#node)" stroke="#B23F17" stroke-width="1"/>
      <ellipse cx="6" cy="4" rx="6" ry="5" fill="url(#node)" stroke="#B23F17" stroke-width="1"/>
      <ellipse cx="-2" cy="8" rx="4.5" ry="3.8" fill="url(#node)" stroke="#B23F17" stroke-width="1"/>
    </g>
  </defs>

  <rect width="480" height="300" rx="22" fill="url(#bg)"/>
  <circle cx="400" cy="58" r="70" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="70" cy="250" r="60" fill="#FFFFFF" opacity="0.4"/>

  <g filter="url(#soft)">
    <!-- legs -->
    <path d="M206 214 L200 292 L232 292 L240 222 L248 292 L280 292 L274 214 Z" fill="url(#pants)"/>
    <!-- arms -->
    <path d="M186 108 C166 116 158 142 154 172 C151 196 150 214 152 230 L170 230 C170 210 172 190 176 170 C179 152 184 138 192 130 Z" fill="url(#shirt)"/>
    <path d="M294 108 C314 116 322 142 326 172 C329 196 330 214 328 230 L310 230 C310 210 308 190 304 170 C301 152 296 138 288 130 Z" fill="url(#shirt)"/>
    <ellipse cx="161" cy="238" rx="11" ry="13" fill="url(#skin)"/>
    <ellipse cx="319" cy="238" rx="11" ry="13" fill="url(#skin)"/>
    <!-- torso -->
    <path d="M190 104 C210 96 270 96 290 104 C298 140 296 180 284 222 L196 222 C184 180 182 140 190 104 Z" fill="url(#shirt)"/>
    <path d="M196 214 L284 214 L282 226 L198 226 Z" fill="#3C4C61"/>
    <!-- neck -->
    <path d="M226 78 L254 78 L257 104 C248 110 232 110 223 104 Z" fill="url(#skin)"/>
    <path d="M222 102 C232 112 248 112 258 102 L262 108 C248 120 232 120 218 108 Z" fill="#6AA99E"/>
    <!-- head -->
    <ellipse cx="240" cy="52" rx="30" ry="34" fill="url(#skin)"/>
    <path d="M210 46 C210 20 226 12 242 12 C262 12 272 26 270 46 C262 34 248 30 236 32 C224 34 214 40 210 46 Z" fill="#4A3B33"/>
    <ellipse cx="210" cy="56" rx="5" ry="8" fill="#E6AE8A"/>
    <ellipse cx="270" cy="56" rx="5" ry="8" fill="#E6AE8A"/>
    <ellipse cx="229" cy="56" rx="3" ry="3.5" fill="#3A2E28"/>
    <ellipse cx="251" cy="56" rx="3" ry="3.5" fill="#3A2E28"/>
    <path d="M232 72 C237 76 243 76 248 72" fill="none" stroke="#B9735A" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="222" cy="66" rx="6" ry="3.5" fill="#F2A08A" opacity="0.5"/>
    <ellipse cx="258" cy="66" rx="6" ry="3.5" fill="#F2A08A" opacity="0.5"/>
  </g>

  <!-- node sites: neck, armpits, groin -->
  <use href="#cluster" x="220" y="101"/>
  <use href="#cluster" x="260" y="101"/>
  <use href="#cluster" x="194" y="128"/>
  <use href="#cluster" x="286" y="128"/>
  <use href="#cluster" x="214" y="226"/>
  <use href="#cluster" x="266" y="226"/>

  <!-- callout rings -->
  <g fill="none" stroke="#E2572A" stroke-width="2" stroke-dasharray="4 5" opacity="0.85">
    <ellipse cx="240" cy="102" rx="44" ry="18"/>
    <ellipse cx="194" cy="128" rx="24" ry="22"/>
    <ellipse cx="286" cy="128" rx="24" ry="22"/>
    <ellipse cx="240" cy="226" rx="48" ry="20"/>
  </g>
</svg>
