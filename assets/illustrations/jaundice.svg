<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="黃疸：左邊是正常膚色與白色眼白，右邊是皮膚與眼白變黃">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF7F5"/>
      <stop offset="1" stop-color="#DDEFEB"/>
    </linearGradient>
    <linearGradient id="panelBad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E6"/>
      <stop offset="1" stop-color="#FCEFCB"/>
    </linearGradient>
    <radialGradient id="skinNormal" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FBE1CD"/>
      <stop offset="0.7" stop-color="#F1C4A4"/>
      <stop offset="1" stop-color="#E2A985"/>
    </radialGradient>
    <radialGradient id="skinYellow" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#F7E79A"/>
      <stop offset="0.7" stop-color="#E9CC62"/>
      <stop offset="1" stop-color="#D4AF3E"/>
    </radialGradient>
    <radialGradient id="scleraNormal" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEFF1"/>
    </radialGradient>
    <radialGradient id="scleraYellow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FBEA86"/>
      <stop offset="1" stop-color="#E8C640"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#8A6248"/>
      <stop offset="1" stop-color="#3E2A1F"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B4F48" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="480" height="300" rx="22" fill="url(#bg)"/>

  <!-- panels -->
  <rect x="22" y="22" width="198" height="256" rx="18" fill="#FFFFFF" filter="url(#soft)"/>
  <rect x="260" y="22" width="198" height="256" rx="18" fill="url(#panelBad)" filter="url(#soft)"/>

  <!-- arrow -->
  <path d="M228 150 L250 150" stroke="#9AB3AE" stroke-width="5" stroke-linecap="round"/>
  <path d="M244 140 L254 150 L244 160" fill="none" stroke="#9AB3AE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== normal face ===== -->
  <g transform="translate(121 150)">
    <path d="M-62 92 C-58 58 -32 44 0 44 C32 44 58 58 62 92 Z" fill="#7FB8AE"/>
    <rect x="-14" y="26" width="28" height="24" fill="#E8B596"/>
    <ellipse cx="0" cy="-8" rx="50" ry="58" fill="url(#skinNormal)"/>
    <ellipse cx="-50" cy="-4" rx="7" ry="12" fill="#E8B596"/>
    <ellipse cx="50" cy="-4" rx="7" ry="12" fill="#E8B596"/>
    <path d="M-52 -18 C-56 -60 -26 -74 2 -72 C32 -72 56 -56 52 -18 C44 -42 22 -50 0 -50 C-22 -50 -42 -42 -52 -18 Z" fill="#B8B4AE"/>
    <!-- eyes -->
    <ellipse cx="-19" cy="-6" rx="14" ry="9" fill="url(#scleraNormal)" stroke="#C99A80" stroke-width="1.4"/>
    <ellipse cx="19" cy="-6" rx="14" ry="9" fill="url(#scleraNormal)" stroke="#C99A80" stroke-width="1.4"/>
    <circle cx="-19" cy="-6" r="6" fill="url(#iris)"/>
    <circle cx="19" cy="-6" r="6" fill="url(#iris)"/>
    <circle cx="-21" cy="-8" r="1.8" fill="#FFFFFF"/>
    <circle cx="17" cy="-8" r="1.8" fill="#FFFFFF"/>
    <path d="M-30 -22 C-22 -27 -14 -27 -8 -23" fill="none" stroke="#8C847C" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 -22 C22 -27 14 -27 8 -23" fill="none" stroke="#8C847C" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 2 C-3 12 -5 16 0 18" fill="none" stroke="#D3977A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-12 30 C-5 35 5 35 12 30" fill="none" stroke="#B9735A" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="-30" cy="16" rx="8" ry="4.5" fill="#F2A08A" opacity="0.45"/>
    <ellipse cx="30" cy="16" rx="8" ry="4.5" fill="#F2A08A" opacity="0.45"/>
  </g>
  <!-- normal badge -->
  <circle cx="196" cy="46" r="15" fill="#0F766E"/>
  <path d="M189 46 L194 51 L203 41" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== jaundiced face ===== -->
  <g transform="translate(359 150)">
    <path d="M-62 92 C-58 58 -32 44 0 44 C32 44 58 58 62 92 Z" fill="#7FB8AE"/>
    <rect x="-14" y="26" width="28" height="24" fill="#D9B648"/>
    <ellipse cx="0" cy="-8" rx="50" ry="58" fill="url(#skinYellow)"/>
    <ellipse cx="-50" cy="-4" rx="7" ry="12" fill="#D9B648"/>
    <ellipse cx="50" cy="-4" rx="7" ry="12" fill="#D9B648"/>
    <path d="M-52 -18 C-56 -60 -26 -74 2 -72 C32 -72 56 -56 52 -18 C44 -42 22 -50 0 -50 C-22 -50 -42 -42 -52 -18 Z" fill="#B8B4AE"/>
    <ellipse cx="-19" cy="-6" rx="14" ry="9" fill="url(#scleraYellow)" stroke="#B8962E" stroke-width="1.4"/>
    <ellipse cx="19" cy="-6" rx="14" ry="9" fill="url(#scleraYellow)" stroke="#B8962E" stroke-width="1.4"/>
    <circle cx="-19" cy="-6" r="6" fill="url(#iris)"/>
    <circle cx="19" cy="-6" r="6" fill="url(#iris)"/>
    <circle cx="-21" cy="-8" r="1.8" fill="#FFFFFF"/>
    <circle cx="17" cy="-8" r="1.8" fill="#FFFFFF"/>
    <path d="M-30 -22 C-22 -27 -14 -27 -8 -23" fill="none" stroke="#8C847C" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 -22 C22 -27 14 -27 8 -23" fill="none" stroke="#8C847C" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 2 C-3 12 -5 16 0 18" fill="none" stroke="#B8962E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-12 32 C-5 29 5 29 12 32" fill="none" stroke="#9C7A22" stroke-width="2.6" stroke-linecap="round"/>
    <!-- magnifier on the eye -->
    <circle cx="19" cy="-6" r="24" fill="none" stroke="#E2572A" stroke-width="3"/>
    <path d="M36 11 L52 27" stroke="#E2572A" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- warning badge -->
  <circle cx="434" cy="46" r="15" fill="#E2572A"/>
  <path d="M434 37 L434 49" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="434" cy="55" r="2.2" fill="#FFFFFF"/>
</svg>
